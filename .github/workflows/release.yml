name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP: locas-ants-bevy

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          PKG="$APP-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$PKG"
          cp "target/release/$APP${{ matrix.exe }}" "dist/$PKG/"
          cp -r assets maps LICENSE README.md "dist/$PKG/"
          rm -f "dist/$PKG/maps/saved_map.txt"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp packaging/windows/* "dist/$PKG/"
            (cd dist && 7z a "$PKG.zip" "$PKG" > /dev/null)
          else
            tar -czf "dist/$PKG.tar.gz" -C dist "$PKG"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
