name: Release

# Pushing a v* tag builds single-file binaries for every OS and publishes a GitHub release.
# Running the workflow manually only builds them and keeps them as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APP: locas-ants-bevy

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp "target/release/$APP.exe" "out/$APP-${GITHUB_REF_NAME}-windows-x86_64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    name: Linux x86_64
    # Oldest supported runner, so the binary works on older glibc versions too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p out
          # tar keeps the executable bit, which a bare download would lose
          tar -czf "out/$APP-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C target/release "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Package as .app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="out/Locas-Ants Bevy.app"
          mkdir -p "$BUNDLE/Contents/MacOS"
          lipo -create -output "$BUNDLE/Contents/MacOS/$APP" \
            "target/aarch64-apple-darwin/release/$APP" \
            "target/x86_64-apple-darwin/release/$APP"
          cat > "$BUNDLE/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Locas-Ants Bevy</string>
            <key>CFBundleDisplayName</key><string>Locas-Ants Bevy</string>
            <key>CFBundleIdentifier</key><string>com.github.olekkut.locas-ants-bevy</string>
            <key>CFBundleExecutable</key><string>$APP</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature (no Apple developer account); Gatekeeper still asks on first launch
          codesign --force --deep --sign - "$BUNDLE"
          (cd out && ditto -c -k --keepParent "Locas-Ants Bevy.app" "$APP-${GITHUB_REF_NAME}-macos-universal.zip")
          rm -rf "$BUNDLE"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            Single-file downloads with all sprites and built-in maps compiled in; no install needed.

            | OS | File | How to run |
            | :-- | :-- | :-- |
            | Windows 10/11 (x64) | `*-windows-x86_64.exe` | Double-click. If SmartScreen warns, choose *More info → Run anyway*. |
            | macOS 11+ (Apple Silicon & Intel) | `*-macos-universal.zip` | Unzip and open *Locas-Ants Bevy.app*. The first time, right-click → *Open* (the app is not notarized). |
            | Linux (x64, glibc 2.35+) | `*-linux-x86_64.tar.gz` | `tar -xzf` it and run `./locas-ants-bevy`. |
